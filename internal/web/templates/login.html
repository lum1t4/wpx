{{define "login.html"}}<!doctype html>
<html lang="en">
  <head>
    {{template "head" .}}
    <title>{{.Title}} · WPX</title>
  </head>
  <body class="bg-zinc-50 font-sans text-zinc-950 antialiased">
    <main class="flex min-h-screen flex-col items-center justify-center px-5 py-12">
      <div class="mb-8 flex items-center gap-2.5">{{template "logo"}}</div>
      <section
        class="w-full max-w-sm rounded-lg border border-zinc-200 bg-white p-6 shadow-xs sm:p-8"
      >
        <h1 class="text-xl font-semibold tracking-tight">Welcome back</h1>
        <p class="mt-2 text-sm leading-6 text-zinc-500">Sign in to operate this server.</p>
        {{if .Error}}
        <p
          class="mt-5 rounded-md border border-red-200 bg-red-50 px-3 py-2.5 text-sm text-red-700"
          role="alert"
        >
          {{.Error}}
        </p>
        {{end}}
        <form class="mt-6 grid gap-5" method="post" action="/login">
          <input type="hidden" name="csrf_token" value="{{.CSRF}}" /><label
            ><span class="mb-2 block text-sm font-medium"
              >Username</span
            ><input
              class="h-10 w-full rounded-md border border-zinc-200 bg-white px-3 text-sm shadow-xs focus:outline-2 focus:outline-offset-2 focus:outline-zinc-900"
              name="username"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              required
              autofocus /></label
          ><label
            ><span class="mb-2 block text-sm font-medium"
              >Password</span
            ><input
              class="h-10 w-full rounded-md border border-zinc-200 bg-white px-3 text-sm shadow-xs focus:outline-2 focus:outline-offset-2 focus:outline-zinc-900"
              type="password"
              name="password"
              autocomplete="current-password"
              required /></label
          ><button
            class="inline-flex h-10 w-full cursor-pointer items-center justify-center rounded-md bg-zinc-950 px-4 text-sm font-medium text-white shadow-xs hover:bg-zinc-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-zinc-900 disabled:cursor-not-allowed disabled:opacity-50"
            type="submit"
          >
            Sign in
          </button>
        </form>
      </section>
    </main>
  </body>
</html>
{{end}}
