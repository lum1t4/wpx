{{define "site_runtime.html"}}{{template "shell-start" .}}
<div class="max-w-2xl"><h1 class="text-2xl font-semibold">Node runtime</h1><p class="mt-1 text-sm text-zinc-500">Configure the entrypoint and loopback port.</p>{{if .Message}}<div class="mt-5 rounded-md border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm">{{.Message}}</div>{{end}}{{if .Error}}<div class="mt-5 rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-900">{{.Error}}</div>{{end}}<form class="mt-6 space-y-4 rounded-lg border border-zinc-200 p-5" method="post" action="/sites/{{.Site.ID}}/runtime"><input type="hidden" name="csrf_token" value="{{.CSRF}}"><label class="block text-sm font-medium">Entrypoint under public/<input class="mt-1 w-full rounded-md border border-zinc-300 px-3 py-2" name="entrypoint" value="{{if .NodeRuntime}}{{.NodeRuntime.Entrypoint}}{{end}}" placeholder="server.js" required></label><label class="block text-sm font-medium">Loopback port<input class="mt-1 w-full rounded-md border border-zinc-300 px-3 py-2" name="port" type="number" min="1024" max="65535" value="{{if .NodeRuntime}}{{.NodeRuntime.Port}}{{end}}" required></label><label class="block text-sm font-medium">Arguments<input class="mt-1 w-full rounded-md border border-zinc-300 px-3 py-2" name="arguments" value="{{index .Form "arguments"}}" placeholder="--production"></label><p class="text-xs text-zinc-500">Upstream must match this port. Separate arguments with spaces.</p><button class="rounded-md bg-zinc-950 px-4 py-2 text-sm font-medium text-white">Save runtime</button></form></div>{{template "shell-end" .}}{{end}}
