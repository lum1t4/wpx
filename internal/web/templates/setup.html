{{define "setup.html"}}<!doctype html>
<html lang="en"><head>{{template "head"}}<title>{{.Title}} · WPX</title></head>
<body class="bg-slate-50 text-slate-900"><main class="grid min-h-screen place-items-center p-6"><section class="w-full max-w-lg rounded-2xl border border-slate-200 bg-white p-8 shadow-sm"><div class="font-black tracking-[.18em] text-wpx-600">WPX</div><h1 class="mt-3 text-3xl font-bold tracking-tight">Create the owner</h1><p class="mt-2 text-slate-500">Use the one-time token printed by the installer. The owner controls server security and all sites.</p>{{if .Error}}<p class="mt-5 rounded-lg bg-red-50 p-3 text-sm font-medium text-red-700">{{.Error}}</p>{{end}}
<form class="mt-6 grid gap-5" method="post" action="/setup"><input type="hidden" name="csrf_token" value="{{.CSRF}}"><label><span class="mb-1.5 block text-sm font-semibold text-slate-700">Bootstrap token</span><input class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-slate-900 focus:border-wpx-500 focus:ring-2 focus:ring-wpx-100" type="password" name="bootstrap_token" required autofocus></label><label><span class="mb-1.5 block text-sm font-semibold text-slate-700">Username</span><input class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-slate-900 focus:border-wpx-500 focus:ring-2 focus:ring-wpx-100" name="username" autocomplete="username" required></label><div class="grid gap-5 sm:grid-cols-2"><label><span class="mb-1.5 block text-sm font-semibold text-slate-700">Password</span><input class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-slate-900 focus:border-wpx-500 focus:ring-2 focus:ring-wpx-100" type="password" name="password" minlength="12" autocomplete="new-password" required></label><label><span class="mb-1.5 block text-sm font-semibold text-slate-700">Confirm password</span><input class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-slate-900 focus:border-wpx-500 focus:ring-2 focus:ring-wpx-100" type="password" name="password_confirm" minlength="12" autocomplete="new-password" required></label></div><button class="inline-flex cursor-pointer items-center justify-center rounded-lg bg-wpx-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-wpx-700" type="submit">Create owner</button></form></section></main></body></html>{{end}}
