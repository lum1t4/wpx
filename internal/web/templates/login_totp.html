{{define "login_totp.html"}}<!doctype html><html lang="en"><head>{{template "head"}}<title>{{.Title}} · WPX</title></head>
<body class="bg-slate-50 text-slate-900"><main class="grid min-h-screen place-items-center p-6"><section class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm"><div class="font-black tracking-[.18em] text-wpx-600">WPX</div><h1 class="mt-3 text-3xl font-bold tracking-tight">Verify sign-in</h1><p class="mt-2 text-slate-500">Enter the six-digit code from your authenticator, or one recovery code.</p>{{if .Error}}<p class="mt-5 rounded-lg bg-red-50 p-3 text-sm font-medium text-red-700">{{.Error}}</p>{{end}}
<form class="mt-6 space-y-5" method="post" action="/login/totp"><input type="hidden" name="csrf_token" value="{{.CSRF}}"><label><span class="mb-1.5 block text-sm font-semibold text-slate-700">Authentication code</span><input class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 font-mono text-slate-900 focus:border-wpx-500 focus:ring-2 focus:ring-wpx-100" name="code" inputmode="numeric" autocomplete="one-time-code" required autofocus></label><button class="inline-flex w-full cursor-pointer items-center justify-center rounded-lg bg-wpx-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-wpx-700" type="submit">Verify</button></form></section></main></body></html>{{end}}
