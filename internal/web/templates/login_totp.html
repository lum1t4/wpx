{{define "login_totp.html"}}
<!doctype html>
<html lang="en">
<head>
  {{template "head" .}}
  <title>{{.Title}} · WPX</title>
</head>
<body class="bg-zinc-50 font-sans text-zinc-950 antialiased">
  <main class="flex min-h-screen flex-col items-center justify-center px-5 py-12">
    <a href="/login" class="mb-8 flex items-center gap-2.5" aria-label="WPX sign in">{{template "logo"}}</a>
    <section class="w-full max-w-sm rounded-lg border border-zinc-200 bg-white p-6 shadow-xs sm:p-8">
      <h1 class="text-xl font-semibold tracking-tight">Verify sign-in</h1>
      <p class="mt-2 text-sm leading-6 text-zinc-500">Enter the six-digit code from your authenticator, or one recovery code.</p>
      {{if .Error}}<p role="alert" class="mt-5 rounded-md border border-red-200 bg-red-50 px-3 py-2.5 text-sm text-red-700">{{.Error}}</p>{{end}}
      <form class="mt-6 space-y-5" method="post" action="/login/totp">
        <input type="hidden" name="csrf_token" value="{{.CSRF}}">
        <div>
          <label for="authentication-code" class="block text-sm font-medium">Authentication code</label>
          <input id="authentication-code" class="mt-2 h-10 w-full rounded-md border border-zinc-200 bg-white px-3 font-mono text-sm shadow-xs focus:outline-2 focus:outline-offset-2 focus:outline-zinc-900" name="code" autocomplete="one-time-code" autocapitalize="none" spellcheck="false" required autofocus>
        </div>
        <button class="inline-flex h-10 w-full cursor-pointer items-center justify-center rounded-md bg-zinc-950 px-4 text-sm font-medium text-white shadow-xs hover:bg-zinc-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-zinc-900" type="submit">Verify</button>
      </form>
      <a href="/login" class="mt-5 inline-block text-sm text-zinc-500 hover:text-zinc-950">Back to sign in</a>
    </section>
  </main>
</body>
</html>
{{end}}
