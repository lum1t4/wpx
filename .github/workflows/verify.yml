name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact source under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install the pinned UI toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Build embedded Tailwind CSS
        run: npm ci --ignore-scripts && npm run build:css
      - name: Reject generated UI drift
        run: git diff --exit-code -- internal/web/static/app.css
      - name: Enforce direct Tailwind utility styling
        run: |
          ! rg '@apply|class="[^"]*__[^"]*"|class="[^"]*--[^"]*"|\.(wpx-card|wpx-button)' assets internal/web/templates --glob '*.css' --glob '*.html'
      - name: Validate the release bootstrap
        run: sh -n install.sh
      - name: Test
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...
      - name: Verify portable Linux builds
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/wpx-linux-amd64 ./cmd/wpx
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/wpx-linux-arm64 ./cmd/wpx
