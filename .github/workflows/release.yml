name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    # Repository rules must restrict v* tags to the owner and require that the
    # tagged commit is reachable from protected main.
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require the tag commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Install the pinned Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install the pinned UI toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Build embedded Tailwind CSS
        run: npm ci --ignore-scripts && npm run build:css
      - name: Reject generated UI drift
        run: git diff --exit-code -- internal/web/static/app.css
      - name: Enforce direct Tailwind utility styling
        run: |
          ! rg '@apply|class="[^"]*__[^"]*"|class="[^"]*--[^"]*"|\.(wpx-card|wpx-button)' assets internal/web/templates --glob '*.css' --glob '*.html'
      - name: Validate the release bootstrap
        run: sh -n install.sh
      - name: Test and analyze
        run: go test -race ./... && go vet ./...
      - name: Build reproducible static binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          BUILD_DATE=$(git show -s --format=%cI "$GITHUB_SHA")
          flags="-s -w -buildid= -X github.com/lum1t4/wpx/internal/buildinfo.Version=${VERSION} -X github.com/lum1t4/wpx/internal/buildinfo.Commit=${GITHUB_SHA} -X github.com/lum1t4/wpx/internal/buildinfo.Date=${BUILD_DATE}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$flags" -o dist/wpx-linux-amd64 ./cmd/wpx
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$flags" -o dist/wpx-linux-arm64 ./cmd/wpx
          cp install.sh dist/install.sh
          (cd dist && sha256sum wpx-linux-amd64 wpx-linux-arm64 > checksums.txt)
          go list -m -json all > dist/go-modules.json
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/wpx-linux-amd64
            dist/wpx-linux-arm64
            dist/checksums.txt
            dist/install.sh
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/wpx-linux-amd64 dist/wpx-linux-arm64 dist/checksums.txt dist/install.sh dist/go-modules.json \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
